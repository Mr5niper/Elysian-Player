<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elysian Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="resize-top" class="resize-handle edge" data-edge="top"></div>
<div id="resize-right" class="resize-handle edge" data-edge="right"></div>
<div id="resize-bottom" class="resize-handle edge" data-edge="bottom"></div>
<div id="resize-left" class="resize-handle edge" data-edge="left"></div>

<div id="resize-tl" class="resize-handle corner" data-edge="topleft"></div>
<div id="resize-tr" class="resize-handle corner" data-edge="topright"></div>
<div id="resize-br" class="resize-handle corner" data-edge="bottomright"></div>
<div id="resize-bl" class="resize-handle corner" data-edge="bottomleft"></div>

<div id="app">

  <div id="titlebar" class="pywebview-drag-region">
    <div class="spacer pywebview-drag-region"></div>
    <div class="winbtn" id="win-min" title="Minimise">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
    <div class="winbtn" id="win-max" title="Maximise">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect id="max-box" x="5" y="5" width="14" height="14" rx="2"/>
        <g id="max-restore" style="display:none">
          <rect x="4" y="8" width="12" height="12" rx="2"/>
          <path d="M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/>
        </g>
      </svg>
    </div>
    <div class="winbtn close" id="win-close" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </div>
  </div>

  <div id="body">
    <div id="sidebar">
      <div class="navitem" data-view="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h2v18H6a2 2 0 0 1-2-2z"/><path d="M10 3h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2z"/><path d="m16.5 4.5 2 .5a2 2 0 0 1 1.4 2.4l-3 12"/></svg>
        Library
      </div>
      <div class="navitem" data-view="playlists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="15" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="11" y2="18"/><circle cx="19" cy="16" r="3"/><line x1="22" y1="16" x2="22" y2="7"/></svg>
        Playlist
      </div>
      <div class="navitem active" data-view="now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        Now Playing
      </div>
    </div>

    <div id="main">
      <div class="panelhead">
        <h1 id="panel-title">Now playing</h1>
        <div class="headicons">
          <svg id="ic-add" title="Add files" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <svg id="ic-folder" title="Add folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </div>
      </div>

      <div id="view-now" class="view">
      <div id="nowplaying">
        <div id="artwrap">
          <div id="art">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <div id="np-title">Nothing playing</div>
          <div id="np-artist"></div>
        </div>
        <canvas id="wave"></canvas>
        <canvas id="visualizer" class="hidden"></canvas>
      </div>
      </div>

      <div id="view-library" class="view hidden">
        <div id="libtools">
          <div id="libtabs">
            <button class="libtab active" data-lib="albums">Albums</button>
            <button class="libtab" data-lib="artists">Artists</button>
            <button class="libtab" data-lib="genres">Genres</button>
            <button class="libtab" data-lib="songs">Songs</button>
          </div>
          <input id="libfilter" type="text" placeholder="Filter" spellcheck="false">
          <button class="tbtn" id="lib-folders">Folders</button>
          <button class="tbtn" id="lib-rescan">Rescan</button>
        </div>

        <div id="libcrumb" class="hidden">
          <button class="tbtn" id="lib-back">Back</button>
          <span id="libcrumb-title"></span>
          <span class="spacer"></span>
          <button class="tbtn" id="lib-edit" disabled>Edit Tags</button>
          <button class="tbtn" id="lib-queue">Add to playlist</button>
          <button class="tbtn" id="lib-queue-all">Add all to playlist</button>
          <button class="tbtn" id="lib-play">Play</button>
        </div>

        <div id="libfolders" class="hidden">
          <div class="foldhead">Folders in your library</div>
          <div id="foldlist"></div>
          <div class="foldfoot">
            <button class="tbtn" id="lib-add">Add a folder</button>
            <span class="foldnote">Removing a folder only takes it out of the
              library. Nothing on disk is deleted.</span>
          </div>
        </div>

        <div id="libgrid"></div>
        <div id="libdetail" class="hidden">
          <div id="libcover">
            <div class="cover" id="libcover-art"></div>
            <div class="ct" id="libcover-title"></div>
            <div class="ca" id="libcover-artist"></div>
            <div class="cs" id="libcover-sub"></div>
            <div id="libcover-actions"></div>
          </div>
          <div id="libtracks"></div>
        </div>

        <div id="libempty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <div>No music indexed yet</div>
          <button class="tbtn" id="lib-add-empty">Add a folder</button>
        </div>
        <div id="libstat"></div>
      </div>

      <div id="view-list" class="view hidden">
        <div id="listtools">
          <input id="filter" type="text" placeholder="Filter" spellcheck="false">
          <button class="tbtn" id="btn-load">Load M3U</button>
          <button class="tbtn" id="btn-save">Save M3U</button>
          <button class="tbtn" id="btn-clear" title="Clear the entire playlist">Clear Playlist</button>
        </div>
        <div id="tracks"><div id="sizer"></div></div>
        <div id="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <div>Drop music here, or use the + above</div>
        </div>
      </div>
    </div>
  </div>

  <div id="transport">
    <div id="trow1">
      <div id="tleft"><span id="status"></span></div>
      <div id="tcenter">
        <button class="tctl" id="prev" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6v12H5V6zm12 0v12L9.5 12z"/></svg>
        </button>
        <button id="play" title="Play">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path id="play-path" d="M7 4l13 8-13 8z"/></svg>
        </button>
        <button class="tctl" id="next" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 6v12h2V6zM5 6v12l9.5-6z"/></svg>
        </button>
      </div>
      <div id="tright">
        <button class="toggle" id="shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
          Shuffle
        </button>
        <button class="toggle" id="repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
          <span id="repeat-label">Repeat</span>
        </button>
      </div>
    </div>

    <div id="trow2">
      <span class="time" id="t-now">0:00</span>
      <div class="slider" id="seek">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
      </div>
      <span class="time right" id="t-total">0:00</span>
      <svg id="volicon" title="Mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><g id="vol-waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g><g id="vol-muted" style="display:none" stroke-linecap="round"><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></g></svg>
      <div class="slider" id="vol">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
      </div>
    </div>
  </div>

  <div id="drophint">Drop to add to playlist</div>

  <div id="modal">
    <div id="modal-box">
      <div id="modal-text">Are you sure?</div>
      <div id="modal-buttons">
        <button class="tbtn" id="modal-yes">Yes</button>
        <button class="tbtn" id="modal-no">No</button>
      </div>
    </div>
  </div>

  <div id="tagmodal">
    <div id="tagmodal-box">
      <div id="tagmodal-title">Edit Tags</div>
      <div id="tagmodal-sub"></div>

      <div id="tagmodal-body">
        <label>Title
          <input id="tag-title" type="text" spellcheck="false">
        </label>
        <label>Artist
          <input id="tag-artist" type="text" spellcheck="false">
        </label>
        <label>Album
          <input id="tag-album" type="text" spellcheck="false">
        </label>
        <label>Album Artist
          <input id="tag-album-artist" type="text" spellcheck="false">
        </label>
        <label>Genre
          <input id="tag-genre" type="text" spellcheck="false">
        </label>
        <div class="tagrow-pair">
          <label>Track
            <input id="tag-track-number" type="number" min="0">
          </label>
          <label>of
            <input id="tag-track-total" type="number" min="0">
          </label>
        </div>
        <div class="tagrow-pair">
          <label>Disc
            <input id="tag-disc-number" type="number" min="0">
          </label>
          <label>of
            <input id="tag-disc-total" type="number" min="0">
          </label>
        </div>
        <label>Year
          <input id="tag-year" type="number" min="0">
        </label>
        <label class="checkrow">
          <input id="tag-compilation" type="checkbox">
          Part of a compilation
        </label>
      </div>

      <div id="tagmodal-errors" class="hidden"></div>

      <div id="tagmodal-buttons">
        <button class="tbtn" id="tag-cancel">Cancel</button>
        <button class="tbtn" id="tag-save">Save</button>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
